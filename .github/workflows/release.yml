name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify version matches tag
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          if ($env:GITHUB_REF_NAME -ne "v$($pom.project.version)") { throw 'Tag must match pom.xml version.' }
      - run: mvn -B -ntp clean verify
      - name: Test distribution
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/flowtrail-dist.zip --verify-tag --generate-notes
